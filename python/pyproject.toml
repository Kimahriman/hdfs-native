[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "hdfs-native"
description = "Python bindings for hdfs-native Rust library"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "argcomplete>=3.0.0",
    "typing-extensions",
    "fsspec"
]

[dependency-groups]
docs = [
    "sphinx~=9.0",
    "sphinx-automodapi~=0.22",
    "sphinx-rtd-theme~=3.1"
]
dev = [
    "maturin>=1.14",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-benchmark~=5.2",
    "ruff>=0.14.4",
    "ty>=0.0.4",
]

[project.urls]
repository = "https://github.com/Kimahriman/hdfs-native"
documentation = "https://hdfs-native.readthedocs.io/"

[project.scripts]
hdfsn = "hdfs_native.cli:main"

[project.entry-points."fsspec.specs"]
hdfs = "hdfs_native.fsspec.HdfsFileSystem"
viewfs = "hdfs_native.fsspec.ViewfsFileSystem"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hdfs_native._internal"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "hdfs_native",
]
addopts = "-m 'not benchmark'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
extend-select = ["I"]
